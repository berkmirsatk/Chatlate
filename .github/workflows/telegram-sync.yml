name: Sync Telegram changelogs
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-sync-dispatch
  cancel-in-progress: false

jobs:
  notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ask Plumgins Bot to refresh Chatlate announcements
        env:
          GH_TOKEN: ${{ secrets.PLUMGINS_GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'Set PLUMGINS_GITHUB_TOKEN to enable the separate bot workflow.' >&2
            exit 1
          fi
          gh workflow run telegram-sync.yml --repo berkmirsatk/Plumgins-Bot \
            --ref main --field plugin=chatlate
