name: Sync Telegram changelogs
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  # Publishing a Release announces it in the channel.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-sync-dispatch
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ask Plumgins Bot to announce and refresh Chatlate releases
        env:
          GH_TOKEN: ${{ secrets.PLUMGINS_GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::warning::PLUMGINS_GITHUB_TOKEN is not set; skipping Telegram announcements.'
            exit 0
          fi
          gh workflow run telegram-sync.yml --repo berkmirsatk/Plumgins-Bot \
            --ref main --field plugin=chatlate
